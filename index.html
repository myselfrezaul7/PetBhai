        background: var(--app-bg);
        background-size: 100% 100%;
        background-attachment: fixed;
        transition: background 0.4s ease;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
        word-wrap: break-word;
        margin: 0;
        min-height: 100vh;
      }

      @media (max-width: 768px) {
        body {
          background-attachment: scroll;
        }
      }

      @keyframes gradient-shift {
        0% {
          background-position: 0% 50%;
        }

        100% {
          background-position: 100% 50%;
        }
      }

      /* Loading skeleton for CLS prevention */
      .skeleton {
        background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%);
        background-size: 200% 100%;
        animation: skeleton-loading 1.5s infinite;
      }

      @keyframes skeleton-loading {
        0% {
          background-position: 200% 0;
        }

        100% {
          background-position: -200% 0;
        }
      }

      html.dark .skeleton {
        background: linear-gradient(90deg, #1e293b 25%, #334155 50%, #1e293b 75%);
        background-size: 200% 100%;
      }

      /* Initial app loading state - prevents CLS */
      #root:empty {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }

      #root:empty::before {
        content: '';
        width: 48px;
        height: 48px;
        border: 4px solid #f97316;
        border-top-color: transparent;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* Refined Glassmorphism - iOS 17.2 Styled Premium Glass */
      .glass-card {
        background: var(--glass-bg);
        background-image: var(--glass-gradient);
        -webkit-backdrop-filter: saturate(var(--glass-sat)) blur(var(--glass-blur));
        backdrop-filter: saturate(var(--glass-sat)) blur(var(--glass-blur));
        border: 1px solid var(--glass-border);
        border-radius: var(--glass-radius);
        box-shadow: var(--glass-shadow);
        transition:
          transform 0.35s cubic-bezier(0.25, 0.1, 0.25, 1),
          box-shadow 0.35s cubic-bezier(0.25, 0.1, 0.25, 1),
          background-color 0.35s ease,
          border-color 0.35s ease;
      }

      .glass-card:hover {
        transform: translateY(-3px);
        background: var(--glass-bg-hover);
        background-image: var(--glass-gradient);
        box-shadow: var(--glass-shadow-hover);
      }

      @media (min-width: 768px) {
        .glass-card {
          border-radius: calc(var(--glass-radius) + 0.25rem);
        }
      }

      /* iOS 26 Liquid Glass — translucent, high-blur material */
      .glass-card-ios {
        background: var(--glass-bg);
        background-image: var(--glass-gradient-ios);
        -webkit-backdrop-filter: saturate(var(--glass-sat)) blur(var(--glass-blur));
        backdrop-filter: saturate(var(--glass-sat)) blur(var(--glass-blur));
        border: 0.5px solid var(--glass-border);
        border-bottom-color: var(--glass-border-bottom);
        border-radius: var(--glass-radius-ios);
        box-shadow:
          var(--glass-shadow),
          inset 0 0.5px 0 0 var(--glass-highlight);
        transition:
          transform 0.5s cubic-bezier(0.22, 1, 0.36, 1),
          box-shadow 0.5s cubic-bezier(0.22, 1, 0.36, 1),
          background-color 0.4s ease,
          border-color 0.4s ease;
        position: relative;
        overflow: hidden;
      }

      /* Specular highlight shimmer on glass cards */
      .glass-card-ios::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 50%;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.18) 0%,
          rgba(255, 255, 255, 0.06) 40%,
          transparent 100%
        );
        pointer-events: none;
        border-radius: var(--glass-radius-ios) var(--glass-radius-ios) 0 0;
        z-index: 1;
      }

      html.dark .glass-card-ios::before {
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.06) 0%,
          rgba(255, 255, 255, 0.02) 40%,
          transparent 100%
        );
      }

      .glass-card-ios:hover {
        transform: translateY(-4px) scale(1.005);
        background: var(--glass-bg-hover);
        background-image: var(--glass-gradient-ios);
        box-shadow:
          var(--glass-shadow-hover),
          inset 0 0.5px 0 0 var(--glass-highlight);
      }

      /* Animation Delay Utilities */
      .animation-delay-2000 {
        animation-delay: 2s;
      }

      .animation-delay-4000 {
        animation-delay: 4s;
      }

      .animation-delay-100 {
        animation-delay: 100ms;
      }

      .animation-delay-200 {
        animation-delay: 200ms;
      }

      .animation-delay-300 {
        animation-delay: 300ms;
      }

      .animation-delay-400 {
        animation-delay: 400ms;
      }

      .animation-delay-500 {
        animation-delay: 500ms;
      }

      /* Dark mode text improvements */
      html.dark {
        color-scheme: dark;
      }

      html.dark body {
        color: #f1f5f9;
        /* Slate 100 for better readability */
      }

      /* Improved input styles for dark mode */
      html.dark input,
      html.dark textarea,
      html.dark select {
        color-scheme: dark;
        background-color: rgba(20, 22, 26, 0.6) !important;
        /* Ensure background is dark */
        color: #f8fafc !important;
        /* Extremely light text */
        border-color: rgba(255, 255, 255, 0.1);
      }

      html.dark input::placeholder,
      html.dark textarea::placeholder {
        color: #94a3b8;
        /* Slate 400 */
      }

      /* Better focus states in dark mode */
      html.dark input:focus,
      html.dark textarea:focus,
      html.dark select:focus {
        border-color: #f97316 !important;
        box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.25) !important;
        background-color: rgba(20, 22, 26, 0.9) !important;
        outline: none;
      }

      /* Dark mode button improvements */
      html.dark .btn-secondary {
        background-color: rgba(51, 65, 85, 0.8);
        border-color: rgba(71, 85, 105, 0.6);
        color: #f1f5f9;
      }

      html.dark .text-slate-600 {
        /* Fix for hardcoded slate-600 text becoming invisible */
        color: #cbd5e1;
        /* slate-300 */
      }

      html.dark .text-slate-700 {
        color: #e2e8f0;
        /* slate-200 */
      }

      html.dark .text-slate-800 {
        color: #f8fafc;
        /* slate-50 */
      }

      /* Subtle glow effect for dark mode cards */
      html.dark .glass-card.glow-orange {
        box-shadow:
          0 0 20px rgba(249, 115, 22, 0.15),
          0 10px 15px -3px rgba(0, 0, 0, 0.3);
      }

      /* Dark mode select/dropdown improvements */
      html.dark select option {
        background-color: #1a1c20;
        color: #e2e8f0;
      }

      html.dark select:hover {
        border-color: #f97316;
      }

      /* Fix for white backgrounds in dark mode that shouldn't be white */
      html.dark .bg-white {
        background-color: rgba(28, 30, 34, 0.95);
        /* Neutral dark */
        color: white;
      }

      html.dark .bg-slate-50 {
        background-color: #111317;
        /* Neutral near-black */
      }

      html.dark .bg-slate-100 {
        background-color: #1a1c20;
        /* Neutral dark gray */
      }

      /* Dark mode link styles */
      html.dark a:not(.text-orange-500):not(.text-orange-600):hover {
        color: #fb923c;
      }

      /* Dark mode badge styles */
      html.dark .badge-success {
        background-color: rgba(34, 197, 94, 0.2);
        color: #4ade80;
        border: 1px solid rgba(34, 197, 94, 0.3);
      }

      html.dark .badge-warning {
        background-color: rgba(234, 179, 8, 0.2);
        color: #facc15;
        border: 1px solid rgba(234, 179, 8, 0.3);
      }

      html.dark .badge-error {
        background-color: rgba(239, 68, 68, 0.2);
        color: #f87171;
        border: 1px solid rgba(239, 68, 68, 0.3);
      }

      /* Improved disabled states in dark mode */
      html.dark button:disabled,
      html.dark input:disabled,
      html.dark select:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        background-color: rgba(15, 23, 42, 0.5) !important;
      }

      /* Dark mode table styles */
      html.dark table {
        border-color: #334155;
      }

      html.dark th {
        background-color: rgba(30, 41, 59, 0.8);
        color: #f1f5f9;
      }

      html.dark td {
        border-color: #334155;
      }

      html.dark tr:hover {
        background-color: rgba(51, 65, 85, 0.5);
      }

      /* Dark mode divider styles */
      html.dark hr {
        border-color: #334155;
      }

      /* Slim, modern scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }

      ::-webkit-scrollbar-track {
        background: transparent;
      }

      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 10px;
        transition: background 0.3s;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }

      html.dark ::-webkit-scrollbar-thumb {
        background: #475569;
      }

      html.dark ::-webkit-scrollbar-thumb:hover {
        background: #64748b;
      }

      /* Paw Heart Loader (Pure CSS for initial load) */
      .app-loader {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        width: 100%;
        background-color: #f8fafc;
        transition: background-color 0.3s;
      }

      html.dark .app-loader {
        background-color: #0f172a;
      }

      .paw-heart-wrapper {
        position: relative;
        width: 80px;
        height: 80px;
        animation: heartbeat 1.5s ease-in-out infinite;
      }

      .paw-heart-bg {
        width: 100%;
        height: 100%;
        color: #f97316;
        /* orange-500 */
      }

      .paw-heart-icon {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 50%;
        height: 50%;
        color: #f8fafc;
        /* light bg color */
      }

      html.dark .paw-heart-icon {
        color: #0f172a;
        /* dark bg color */
      }

      .loader-text {
        margin-top: 1rem;
        font-family: 'Poppins', sans-serif;
        font-weight: 600;
        color: #f97316;
        animation: pulse 2s infinite;
      }

      @keyframes heartbeat {
        0% {
          transform: scale(1);
        }

        14% {
          transform: scale(1.1);
        }

        28% {
          transform: scale(1);
        }

        42% {
          transform: scale(1.1);
        }

        70% {
          transform: scale(1);
        }
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }

        50% {
          opacity: 0.5;
        }
      }
    </style>
  </head>
